[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegseek-py"
version = "0.6.0"
description = "Pure-Python, steghide-compatible reimplementation of StegSeek 0.6"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "stegseek-py contributors" }]
keywords = ["steghide", "stegseek", "steganography", "cracker", "ctf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
    "pycryptodome>=3.18",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.4"]

[project.scripts]
stegseek = "stegseek.cli:main"
stegseek-py = "stegseek.cli:main"

[project.urls]
Homepage = "https://github.com/RickdeJager/stegseek"
Source = "https://github.com/RickdeJager/stegseek"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stegseek = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "oracle: requires the reference steghide 0.5.1 executable",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep the C++-style printf message API (msg(fmt, *args)) intact: UP031 would
# otherwise suggest f-strings that cannot be passed to Message::print.
select = ["E4", "E7", "E9", "F", "I", "B", "W"]
